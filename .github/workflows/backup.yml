# Weekly pg_dump of the production database to storage outside Neon (Part 3 §9, Part 5 §7).
# The dump is encrypted with BACKUP_PASSPHRASE and kept as a workflow artifact for 90 days.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DIRECT_URL         Neon `main` direct (unpooled) connection string
#   BACKUP_PASSPHRASE  long random passphrase; store it in your password manager too
#
# Restore (test once per quarter, Part 5 §7), into an empty database with PostGIS available:
#   gpg --decrypt atk-YYYY-MM-DD.dump.gpg > atk.dump
#   pg_restore --no-owner --no-privileges --dbname="$TARGET_URL" atk.dump

name: Weekly database backup

on:
  schedule:
    # Saturday 21:30 UTC = Sunday 03:15 in Kathmandu, the quietest hour.
    - cron: '30 21 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install the PostgreSQL 17 client
        # pg_dump must be at least the server's major version (Neon runs Postgres 17).
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DIRECT_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the DIRECT_URL and BACKUP_PASSPHRASE repository secrets"
            exit 1
          fi
          file="atk-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges \
            --dbname="$DIRECT_URL" --file="$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$file.gpg" "$file" 3<<<"$BACKUP_PASSPHRASE"
          rm "$file"
          ls -lh "$file.gpg"
          echo "BACKUP_FILE=$file.gpg" >> "$GITHUB_ENV"

      - name: Keep the encrypted dump for 90 days
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
